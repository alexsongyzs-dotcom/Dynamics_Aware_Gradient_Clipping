# A2: learning-rate--clipping phase diagram sweep
sweep:
  name: phase_diagram
  grid:
    lr: [0.01, 0.05, 0.1, 0.2, 0.4, 0.8, 1.6]
    clipping_threshold: [0.1, 0.3, 1.0, 3.0, 10.0, inf]
  metrics: [convergence, test_acc, exposure, switching_count, oscillation_score, curvature, update_norm]
  seeds: [0, 1, 2, 3, 4]
  load_bearing: true
