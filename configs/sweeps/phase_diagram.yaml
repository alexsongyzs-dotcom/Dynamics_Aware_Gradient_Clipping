# P1 screening sweep. The runner prints a plan unless --execute is explicit.
sweep:
  name: p1_phase_diagram_screen
  base_config: ../experiments/p1_screen.yaml
  grid:
    optimizer.lr: [0.05, 0.1, 0.2, 0.4, 0.8]
    clipping.threshold: [0.1, 0.3, 1.0, 3.0, 10.0]
  seeds: [0, 1]
  output_root: results/sweeps/p1_phase_diagram_screen
  metrics:
    - failed
    - test_accuracy
    - clipping_frequency
    - mean_clipping_intensity
    - episode_transitions
