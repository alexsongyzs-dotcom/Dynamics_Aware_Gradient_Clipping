[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagc"
version = "0.1.0"
description = "Causal experiments on the timing and optimizer placement of gradient clipping"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "YuXin Li" },
    { name = "Zisong Yuan" },
]

[tool.setuptools]
packages = ["src", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
